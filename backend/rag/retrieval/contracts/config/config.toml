[schema]
version = "retrieval_contracts_v1"

[request.defaults]
mode = "hybrid_rrf"
top_k = 12

[request.limits]
max_top_k = 50
max_chat_history_turns = 32
max_metadata_keys = 64

[source_constraints.defaults]
allow_global_search = true
allow_payload_filters = true
max_heading_path_depth = 8
max_payload_filter_keys = 32

[memory.defaults]
enabled = true
scope = "session"
include_short_term = true
include_long_term = false
max_chat_turns = 8
max_user_turns = 4
max_assistant_turns = 4
preserve_recent_turns = 4
memory_top_k = 6
token_budget = 1600

[memory.limits]
max_chat_turns = 64
max_user_turns = 32
max_assistant_turns = 32
max_preserve_recent_turns = 16
max_memory_top_k = 24
max_token_budget = 12000

[query_processing.defaults]
mode = "hybrid"
allow_query_rewrite = true
allow_filter_extraction = true
allow_intent_classification = true
allow_hypothetical_answer = false
max_rewritten_queries = 3
max_extracted_terms = 24

[query_processing.limits]
max_rewritten_queries = 8
max_extracted_terms = 64
max_search_queries = 12

[query_text.limits]
min_chars = 2
max_chars = 4096
too_short_max_chars = 8
too_long_min_chars = 2048
low_information_max_terms = 2

[context.defaults]
max_context_blocks = 8
max_total_tokens = 6000
max_block_tokens = 1200
reserve_tokens_for_answer = 1200
deduplicate_by_chunk_id = true
deduplicate_by_text_hash = true

[context.limits]
max_context_blocks = 24
max_total_tokens = 24000
max_block_tokens = 4000
max_reserve_tokens_for_answer = 8000

[validation]
strict_enums = true
reject_blank_optional_strings = true
reject_non_finite_scores = true
reject_empty_context_blocks = true
reject_empty_candidates = false