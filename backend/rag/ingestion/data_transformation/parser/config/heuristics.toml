[parser_heuristics.file_types]
enabled_families = ["markdown"]

[parser_heuristics.file_types.markdown_variants]
".md" = "markdown"
".markdown" = "markdown"
".mdown" = "markdown"
".mkd" = "markdown"
".mdwn" = "markdown"
".mdx" = "mdx"

[parser_heuristics.file_types.known_extensions]
markdown = [".md", ".markdown", ".mdown", ".mkd", ".mdwn", ".mdx"]
html = [".html", ".htm"]


# ---------------------------------------------------------------------------
# MDX NORMALIZATION
# ---------------------------------------------------------------------------

[parser_heuristics.markdown.mdx_markers]
prefix = "::mdx-component-"
open = "::mdx-component-open"
close = "::mdx-component-close"
self = "::mdx-component-self"


# ---------------------------------------------------------------------------
# HEADING CLEANUP
# ---------------------------------------------------------------------------

[parser_heuristics.markdown.heading_permalink]
texts = [
  "",
  "#",
  "¶",
  "🔗",
  "§",
  "∞",
  "link",
  "permalink",
]


# ---------------------------------------------------------------------------
# CALLOUTS
# ---------------------------------------------------------------------------

[parser_heuristics.markdown.callouts]
max_plain_callout_paragraphs = 2

[parser_heuristics.markdown.callouts.kind_map]
note = "note"
info = "info"
tip = "tip"
warning = "warning"
caution = "warning"
danger = "warning"
important = "important"
"good to know" = "note"
"heads up" = "note"
"technical details" = "info"


# ---------------------------------------------------------------------------
# GENERIC TEXT SIGNALS
# ---------------------------------------------------------------------------

[parser_heuristics.markdown.signals.thresholds]
short_text_max_words = 8
long_text_min_words = 40
command_max_words = 12
label_max_words = 6
label_max_chars = 70

[parser_heuristics.markdown.signals.common_sentence_starters]
