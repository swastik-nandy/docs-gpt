# ---------------------------------------------------------------------------
# SOURCE PROVENANCE
# ---------------------------------------------------------------------------
#
# Every parser atom should retain its original source range.
# Markdown-it token maps use zero-based, end-exclusive line ranges.
#
# No source text should be reconstructed through fuzzy matching when the parser
# can preserve the exact source location directly.

[parser_heuristics.markdown.source_provenance]
enabled = true
preserve_line_spans = true
preserve_block_index = true
preserve_original_text = true
line_numbers_zero_based = true
line_end_exclusive = true


# ---------------------------------------------------------------------------
# LOCAL SEMANTIC SCOPES
# ---------------------------------------------------------------------------
#
# Some documents use formatted short paragraphs as local headings beneath a
# formal Markdown heading.
#
# Detection is based only on formatting, size, punctuation and neighboring
# block structure. It does not depend on product names or known heading text.

[parser_heuristics.markdown.local_scopes]
enabled = true

promote_strong_only_paragraphs = true
remove_promoted_anchor_from_retrieval = true

max_anchor_words = 12
max_anchor_chars = 120
max_lookahead_blocks = 3
minimum_structural_followers = 1

reject_sentence_terminal_period = true
reject_sentence_terminal_question = true
reject_sentence_terminal_exclamation = true
allow_terminal_colon = true

structural_follower_types = [
  "code",
  "generic_table",
  "list",
  "blockquote",
  "component",
]


# ---------------------------------------------------------------------------
# GENERIC SELECTOR-LIKE BLOCKS
# ---------------------------------------------------------------------------
#
# Documentation renderers sometimes flatten tab controls, language selectors
# or variant selectors into ordinary text.
#
# Detection must use neighborhood shape:
# - short, label-like text
# - low sentence-likeness
# - followed by multiple structurally similar blocks
#
# No known selector labels or programming-language names are configured here.

[parser_heuristics.markdown.selector_blocks]
enabled = true

max_words = 20
max_chars = 180
max_lookahead_blocks = 12
minimum_following_blocks = 2

require_short_text = true
require_non_sentence_like = true
require_repeated_following_type = true

eligible_following_types = [
  "code",
  "component",
]

remove_selector_from_retrieval = true
attach_selector_metadata_to_following_blocks = true


# ---------------------------------------------------------------------------
# SEMANTIC PARAGRAPH PACKING
# ---------------------------------------------------------------------------
#
# Markdown paragraphs remain separate parser atoms.
#
# This pass groups adjacent narrative atoms into retrieval units without
# crossing structural boundaries. Paragraph separators remain intact.
#
# The parser uses word-count budgets only as a lightweight approximation.
# Exact embedding-model token enforcement belongs to the chunking layer.

[parser_heuristics.markdown.semantic_packing]
enabled = true

preserve_paragraph_boundaries = true
paragraph_separator = "\n\n"

merge_only_adjacent_blocks = true
merge_only_same_section = true
merge_only_same_local_scope = true
merge_only_same_component_context = true

minimum_target_words = 80
preferred_target_words = 180
maximum_target_words = 280
maximum_blocks_per_group = 6

allow_single_oversized_block = true
flush_before_structural_block = true
flush_after_structural_block = true

eligible_block_types = [
  "paragraph",
]

boundary_block_types = [
  "code",
  "generic_table",
  "list",
  "blockquote",
  "component",
  "thematic_break",
]

# Packing remains structurally driven by default.
# Language-specific discourse plugins may be added independently later.
lexical_dependency_detection_enabled = false


# ---------------------------------------------------------------------------
# RELATIONSHIP LINKING
# ---------------------------------------------------------------------------
#
# Relationship parents must be selected inside the current semantic scope.
# The nearest previous block in the entire section is not automatically valid.

[parser_heuristics.markdown.relationships]
enabled = true

scope_aware = true
maximum_parent_distance = 6

allow_cross_local_scope_parent = false
allow_structural_selector_as_parent = false
allow_table_row_as_code_parent = false
allow_mixed_short_text_as_parent = false

attach_section_context_to_orphan_code = true

# The complete graph relationship is retained by ID.
# Only bounded parent text may be copied into retrieval text.
embed_parent_text = true
parent_text_max_words = 48
parent_text_preserve_complete_sentences = true

sequential_relation_confidence = 0.55
command_parent_confidence = 0.88
immediate_parent_confidence = 0.92
context_parent_confidence = 0.72
section_fallback_confidence = 0.60


# ---------------------------------------------------------------------------
# RETRIEVAL-TEXT CONSTRUCTION
# ---------------------------------------------------------------------------
#
# Retrieval text should remain deterministic and compact.
# Structural fields may be disabled independently without changing parser IR.

[parser_heuristics.markdown.retrieval_text]
include_context = true
include_heading = true
include_local_context = true
include_function = true
include_parent_instruction = true
include_parent_context = true
include_text = true

deduplicate_equal_context_fields = true
preserve_content_paragraphs = true