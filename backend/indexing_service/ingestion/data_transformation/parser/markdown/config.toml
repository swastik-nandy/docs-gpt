[markdown.heading_permalink]
texts = ["", "#", "¶", "🔗", "§", "∞", "link", "permalink"]

[markdown.callouts]
max_plain_callout_paragraphs = 2

[markdown.callouts.kind_map]
note = "note"
info = "info"
tip = "tip"
warning = "warning"
caution = "warning"
danger = "warning"
important = "important"
"good to know" = "note"
"heads up" = "note"
"technical details" = "info"

[markdown.signals.thresholds]
short_text_max_words = 8
long_text_min_words = 40
command_max_words = 12
label_max_words = 6
label_max_chars = 70

[markdown.signals]
common_sentence_starters = [
    "the",
    "this",
    "that",
    "these",
    "those",
    "our",
    "your",
    "their",
    "its",
    "a",
    "an",
